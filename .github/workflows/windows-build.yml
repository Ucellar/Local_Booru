name: Windows build

# A tag «v…» pushed: «Local Booru.exe» and the browser extension are built, checked and published as that tag's
# release — its text is the tag's message (git tag -a v5.39.0 -F release-notes.md).  The release appears only when
# the build passed.  Actions → «Windows build» → Run workflow builds a tag again and replaces the files of its release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean "Local Booru.spec"

      - name: Check the build
        shell: pwsh
        env:
          LOCAL_BOORU_STARTUP_CONSOLE: "0"
          LOCAL_BOORU_DATA_DIR: ${{ runner.temp }}\lb-data
          LOCAL_BOORU_WORKSPACE_FILE: ${{ runner.temp }}\lb-pointer.json
          LOCAL_BOORU_GLOBAL_WORKSPACE_FILE: ${{ runner.temp }}\lb-global-pointer.json
          LOCAL_BOORU_SELFCHECK_OUT: ${{ runner.temp }}\selfcheck.txt
          QT_QPA_PLATFORM: offscreen
        run: |
          $dist = "dist/Local Booru"
          foreach ($need in @("Local Booru.exe", "assets/app_icon.ico", "webui/static/booru.css", "extensions/chrome_local_booru_companion/manifest.json")) {
            if (!(Test-Path (Join-Path $dist $need))) { throw "missing in the build: $need" }
          }
          $p = Start-Process -FilePath (Join-Path $dist "Local Booru.exe") -ArgumentList "--selfcheck" -Wait -PassThru
          Get-Content $env:LOCAL_BOORU_SELFCHECK_OUT
          if ($p.ExitCode -ne 0) { throw "self-check failed: $($p.ExitCode)" }

      - name: Pack
        shell: pwsh
        run: |
          $tag = $env:TAG
          Compress-Archive -Path "dist/Local Booru" -DestinationPath "Local_Booru_${tag}_Windows_x64.zip"
          Compress-Archive -Path "extensions/chrome_local_booru_companion" -DestinationPath "Local_Booru_Companion_${tag}_Chrome.zip"
          Compress-Archive -Path "extensions/firefox_local_booru_companion/*" -DestinationPath "Local_Booru_Companion_${tag}_Firefox.zip"
          Get-ChildItem *.zip | Format-Table Name, Length

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          git for-each-ref "refs/tags/${TAG}" --format='%(contents)' > notes.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" Local_Booru_*.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" Local_Booru_*.zip -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "Local Booru ${TAG#v}" --notes-file notes.md
          fi
