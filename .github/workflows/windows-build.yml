name: Windows build

# «Local Booru.exe» and the browser extension are built, checked and published as a release; the release appears only
# when the build passed.  Actions → «Windows build» → Run workflow: the branch or tag to build, the release's tag (made
# at that commit when it is new) and its text.  A tag «v…» pushed does the same, its text — the tag's message.
# Built again for a release that exists: its files are replaced.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release (v5.39.0)"
        required: true
      notes:
        description: "Text of the release (Markdown)"
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean "Local Booru.spec"

      - name: Check the build
        shell: pwsh
        env:
          LOCAL_BOORU_STARTUP_CONSOLE: "0"
          LOCAL_BOORU_DATA_DIR: ${{ runner.temp }}\lb-data
          LOCAL_BOORU_WORKSPACE_FILE: ${{ runner.temp }}\lb-pointer.json
          LOCAL_BOORU_GLOBAL_WORKSPACE_FILE: ${{ runner.temp }}\lb-global-pointer.json
          LOCAL_BOORU_SELFCHECK_OUT: ${{ runner.temp }}\selfcheck.txt
          QT_QPA_PLATFORM: offscreen
        run: |
          $dist = "dist/Local Booru"
          foreach ($need in @("Local Booru.exe", "assets/app_icon.ico", "webui/static/booru.css", "extensions/chrome_local_booru_companion/manifest.json")) {
            if (!(Test-Path (Join-Path $dist $need))) { throw "missing in the build: $need" }
          }
          $p = Start-Process -FilePath (Join-Path $dist "Local Booru.exe") -ArgumentList "--selfcheck" -Wait -PassThru
          Get-Content $env:LOCAL_BOORU_SELFCHECK_OUT
          if ($p.ExitCode -ne 0) { throw "self-check failed: $($p.ExitCode)" }

      - name: Pack
        shell: pwsh
        run: |
          $tag = $env:TAG
          Compress-Archive -Path "dist/Local Booru" -DestinationPath "Local_Booru_${tag}_Windows_x64.zip"
          Compress-Archive -Path "extensions/chrome_local_booru_companion" -DestinationPath "Local_Booru_Companion_${tag}_Chrome.zip"
          Compress-Archive -Path "extensions/firefox_local_booru_companion/*" -DestinationPath "Local_Booru_Companion_${tag}_Firefox.zip"
          Get-ChildItem *.zip | Format-Table Name, Length

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the text as it came (UTF-8 from the event's file: an environment variable may lose the Cyrillic on Windows)
          python -c "import json, os, pathlib; e = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8')); pathlib.Path('notes.md').write_text((e.get('inputs') or {}).get('notes') or '', encoding='utf-8')"
          if [ ! -s notes.md ]; then
            git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" || true
            git for-each-ref "refs/tags/${TAG}" --format='%(contents)' > notes.md
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" Local_Booru_*.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" Local_Booru_*.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Local Booru ${TAG#v}" --notes-file notes.md
          fi
